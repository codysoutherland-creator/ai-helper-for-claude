[mod-name]
claude-bridge=AI Helper (for Claude)

[mod-description]
claude-bridge=Unofficial - not affiliated with or endorsed by Anthropic. Free in-game helper character, base foreman and blueprint generator, plus an "Ask Claude" link to your own Claude Code companion.

[controls]
claude-toggle-gui=Toggle Claude panel

[string-mod-setting]
claude-who-can-ask-host-only=Host only
claude-who-can-ask-admins=Host and admins
claude-who-can-ask-everyone=Everyone

[mod-setting-name]
claude-foreman-enabled=Foreman: watch the base
claude-foreman-interval=Foreman: scan interval (seconds)
claude-foreman-chat=Foreman: print new alerts to chat
claude-helper-use-player-items=Helper: may take building materials from my inventory
claude-show-coords=Show my coordinates next to the Claude button
claude-show-autopilot-status=Show the autopilot status line next to the Claude button
claude-who-can-ask=Who can use Claude
claude-autopilot-allow-removal=Autopilot: may take apart your builds
claude-autopilot-keepout=Autopilot: keep-out radius around you (tiles)
claude-autopilot-grace-s=Autopilot: seconds before it builds a plan
claude-autopilot-use-player-items=Autopilot: helper may take from my inventory
claude-autopilot-calls-per-hour=Autopilot: Claude calls per hour (cap)
claude-debug-ops=Debug: enable test and cheat ops

[mod-setting-description]
claude-foreman-enabled=Free rule-based scans for power shortages, missing fuel, depleted drills, idle research and more. Adds map alerts.
claude-foreman-interval=How often the foreman scans the base.
claude-foreman-chat=Also print each new alert to chat once.
claude-helper-use-player-items=When building your ghosts, the helper first takes materials from nearby chests and furnaces, then from your inventory (if this is on), and crafts or mines the rest.
claude-who-can-ask=Every question to Claude uses the host's Claude subscription. host-only: only the host (or single-player) can ask Claude, approve plans, run held jobs and command the helper. admins: the host and game admins. everyone: any player can ask, but held (expensive) jobs and plan approvals still need the host or an admin.
claude-autopilot-allow-removal=Off (default): the autopilot never takes apart anything you built; its plans route around your builds. On: plans may list your entities for removal.
claude-autopilot-keepout=The autopilot builds nothing within this many tiles of you or of anything you built, mined or rotated in the last 15 minutes.
claude-autopilot-grace-s=When the autopilot plans a build it says so in chat and waits this long before placing it. Reject the plan in the Plans tab in that time to stop it.
claude-autopilot-use-player-items=Off (default): while the autopilot plays, the helper does not take items out of your inventory.
claude-autopilot-calls-per-hour=Most Claude calls the autopilot makes per hour (the companion's config may set a lower cap). Routine work never calls Claude.
claude-debug-ops=Only for the automated test harness: exposes test ops (simulated chat, clicks and confirmations) and cheats (instant build, give items) over the local UDP/RCON link. Leave off.
claude-show-coords=Live x, y readout so you can match what Claude and the helper say. y grows downward (south).
claude-show-autopilot-status=While the autopilot plays: its goal and next step, Claude calls this hour and the helper's hand-craft share.
